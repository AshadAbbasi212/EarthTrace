[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earthtrace"
version = "1.0.0"
description = "EarthTrace: Free & Open-Source 100% Local AI Geo Locator & Picture Location Finder with Multimodal Verification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ashad Abbasi"}
]
keywords = [
    "geo-locator",
    "geolocator",
    "location-finder",
    "picture-location",
    "photo-location-finder",
    "image-geolocation",
    "find-location-from-photo",
    "where-was-this-photo-taken",
    "photo-coordinate-finder",
    "osint",
    "osint-geolocation",
    "geospy",
    "geospy-alternative",
    "geoclip",
    "pigeon",
    "geoguessr",
    "geolocation-ai",
    "computer-vision",
    "openstreetmap",
    "dem-elevation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/AshadAbbasi212/EarthTrace"
Documentation = "https://github.com/AshadAbbasi212/EarthTrace#readme"
Repository = "https://github.com/AshadAbbasi212/EarthTrace"
"Bug Tracker" = "https://github.com/AshadAbbasi212/EarthTrace/issues"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "torch",
    "torchvision",
    "transformers>=4.40.0",
    "huggingface-hub>=0.22.0",
    "accelerate>=0.29.0",
    "opencv-python-headless>=4.8.0",
    "rapidocr-onnxruntime>=1.3.0",
    "aiofiles>=23.2.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

